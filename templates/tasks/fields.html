{% firstof field_prefix "task" as prefix %}
<div class="form-field">
    <label for="{{ prefix }}-name">Название</label>
    <input id="{{ prefix }}-name" name="name" required{% if initial_focus %} autofocus{% endif %}>
</div>
<div class="form-field">
    <label for="{{ prefix }}-description">Описание</label>
    <textarea id="{{ prefix }}-description" name="description" rows="4"></textarea>
</div>
<div class="task-fields">
    <div class="form-field">
        <label for="{{ prefix }}-priority">Приоритет</label>
        <select id="{{ prefix }}-priority" name="priority_id">
            <option value="">По умолчанию</option>
        </select>
    </div>
    <div class="form-field">
        <label for="{{ prefix }}-start">Плановое начало</label>
        <input id="{{ prefix }}-start" type="datetime-local" name="planned_start_at" step="any">
    </div>
    <div class="form-field">
        <label for="{{ prefix }}-due">Срок выполнения</label>
        <input id="{{ prefix }}-due" type="datetime-local" name="due_at" step="any">
    </div>
</div>
<p class="form-hint">Даты и время указаны в часовом поясе вашего устройства.</p>
