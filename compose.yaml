name: enactus_os_next_dev

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run python3 scripts/init-env.py}
      POSTGRES_USER: ${POSTGRES_USER:?Run python3 scripts/init-env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql --no-psqlrc --no-password
          --host=127.0.0.1 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"
          --set=ON_ERROR_STOP=1 --command='SELECT 1' >/dev/null 2>&1
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    image: &app-image "${COMPOSE_PROJECT_NAME:-enactus_os_next_dev}-web"
    build: .
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000 --noreload"]
    environment: &app-environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run python3 scripts/init-env.py}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:?Run python3 scripts/init-env.py}
      POSTGRES_USER: ${POSTGRES_USER:?Run python3 scripts/init-env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-env.py}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    image: *app-image
    pull_policy: never
    command: ["python", "manage.py", "notification_worker"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: on-failure
    stop_grace_period: 30s

volumes:
  postgres_data:
